<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d241c">
<title>¿Quién es? · Patxanguilles</title>
<style>
:root{
  --paper:#e9dfc8;
  --ink:#33291e;
  --gold:#a27f42;
  --green:#2f4a35;
  --red:#7c3035;
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  color:var(--ink);background:#283228
}
body{
  min-height:100dvh;
  background:
    linear-gradient(rgba(234,224,201,.16),rgba(234,224,201,.16)),
    radial-gradient(ellipse at top,#6d7958,#283228);
}
button{font:inherit}
.game{position:relative;width:100vw;height:100dvh;overflow:hidden}
.top{
  position:absolute;z-index:15;left:10px;right:10px;top:max(8px,env(safe-area-inset-top));
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px
}
.btn{
  min-height:38px;border:1px solid rgba(67,49,28,.22);border-radius:10px;
  padding:0 12px;background:rgba(235,224,198,.88);color:#33291d;font-weight:900;cursor:pointer
}
.title{text-align:center;font:900 clamp(22px,3vw,34px)/1 Georgia,serif}
.stats{
  position:absolute;z-index:14;left:50%;top:56px;transform:translateX(-50%);
  display:flex;gap:5px;padding:4px;border-radius:999px;background:rgba(235,224,198,.82);
  border:1px solid rgba(67,49,28,.16);backdrop-filter:blur(6px)
}
.stat{min-width:72px;text-align:center;padding:4px 8px}
.stat b{display:block;font-size:13px}.stat span{display:block;font-size:7px;text-transform:uppercase;letter-spacing:.1em;color:#75654d}

.stage{
  position:absolute;inset:92px 14px 14px;
  display:grid;grid-template-columns:minmax(260px,42vw) minmax(320px,1fr);
  gap:24px;align-items:center;justify-content:center;
  max-width:1180px;margin:auto
}
.card-col{display:grid;place-items:center;min-width:0;min-height:0}
.card{
  position:relative;
  max-width:100%;max-height:100%;
  background:rgba(236,226,203,.94);
  border:1px solid rgba(72,52,27,.22);
  border-radius:16px;overflow:hidden;
  box-shadow:0 18px 50px rgba(42,31,18,.28)
}
.card.portrait{aspect-ratio:3/4;height:min(72dvh,680px)}
.card.landscape{aspect-ratio:4/3;width:min(46vw,660px)}
.card img{display:block;width:100%;height:100%;object-fit:contain;background:#e9dfc8}

.side{width:min(560px,100%)}
.prompt{margin:0 0 12px;font:900 clamp(18px,2vw,25px)/1.1 Georgia,serif}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.answer{
  min-height:52px;border-radius:12px;border:1px solid rgba(67,49,28,.16);
  padding:10px 12px;background:rgba(235,224,198,.88);color:#342a1e;font-weight:900;cursor:pointer;
  text-align:left;transition:.16s
}
.answer:hover:not(:disabled){transform:translateY(-1px);background:#f1e6cf}
.answer.correct{background:#d4e5d2;border-color:#678965}
.answer.wrong{background:#ead0d1;border-color:#a45a5e}
.answer:disabled{cursor:default}
.feedback{
  min-height:45px;margin-top:10px;padding:10px 12px;border-radius:11px;
  background:rgba(235,224,198,.78);border:1px solid rgba(67,49,28,.13);
  display:flex;align-items:center;font-size:12px
}
.next{
  display:none;width:100%;margin-top:8px;min-height:44px;border:0;border-radius:11px;
  background:#3e352b;color:#f4ead6;font-weight:950;cursor:pointer
}
.next.show{display:block}

.overlay{
  position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:16px;
  background:rgba(30,35,28,.65);backdrop-filter:blur(7px)
}
.overlay.open{display:grid}
.modal{
  width:min(450px,94vw);text-align:center;padding:24px;border-radius:20px;
  background:#e9dfc8;border:1px solid rgba(70,50,27,.23);box-shadow:0 25px 80px rgba(0,0,0,.3)
}
.modal h2{font:900 31px/1 Georgia,serif;margin:7px 0}.score{font-size:44px;font-weight:1000;color:#715525}
.primary{width:100%;min-height:44px;border:0;border-radius:11px;background:#3f352b;color:#f4ead7;font-weight:950;cursor:pointer;margin-top:12px}

.loading{
  position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:20px;
  background:rgba(233,224,201,.64);backdrop-filter:blur(5px);text-align:center
}
.loading-card{padding:18px 22px;border-radius:16px;background:rgba(242,233,212,.94);border:1px solid rgba(70,50,27,.16)}
.spinner{width:35px;height:35px;margin:0 auto 10px;border-radius:50%;border:4px solid rgba(66,48,25,.12);border-top-color:#796037;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.small{font-size:10px;color:#796b56;margin-top:5px}

@media(max-width:720px){
  .top{left:5px;right:5px;top:max(4px,env(safe-area-inset-top));gap:5px}
  .btn{min-height:33px;padding:0 8px;font-size:10px}.title{font-size:19px}
  .stats{top:42px}.stat{min-width:58px;padding:3px 5px}.stat b{font-size:11px}.stat span{font-size:6px}
  .stage{
    inset:72px 6px 6px;grid-template-columns:1fr;grid-template-rows:minmax(0,48%) minmax(0,52%);
    gap:7px
  }
  .card.portrait{height:100%;max-height:100%;width:auto}
  .card.landscape{width:min(88vw,520px);height:auto}
  .side{width:100%}.prompt{text-align:center;font-size:16px;margin-bottom:7px}
  .answers{gap:5px}.answer{min-height:42px;padding:7px 8px;font-size:11px}
  .feedback{min-height:34px;margin-top:6px;padding:7px 8px;font-size:10px}.next{min-height:38px;margin-top:5px}
}

button:focus-visible{outline:3px solid #b48a38;outline-offset:3px}
[hidden]{display:none!important}
.card-col{height:100%}
@media(max-width:720px){.card{max-height:100%}.card.landscape{height:100%;width:auto;max-width:94vw}.stage{grid-template-rows:minmax(0,1fr) auto}.side{padding-bottom:env(safe-area-inset-bottom)}}
@media(max-height:520px){html,body{overflow:auto}.game{min-height:560px;height:100dvh}.stage{overflow:auto}}
</style>
</head>
<body>
<div class="game">
  <div class="top">
    <button class="btn" onclick="location.href='./'">← Juegos</button>
    <div class="title">¿Quién es?</div>
    <button class="btn" id="newGame">↻ Nueva</button>
  </div>
  <div class="stats">
    <div class="stat"><b id="roundStat">0/10</b><span>Ronda</span></div>
    <div class="stat"><b id="correctStat">0</b><span>Aciertos</span></div>
    <div class="stat"><b id="pointsStat">0</b><span>Puntos</span></div>
  </div>
  <div class="stage">
    <div class="card-col"><div id="cardWrap" class="card portrait"></div></div>
    <div class="side">
      <div class="prompt">¿Qué futbolista aparece en este cromo?</div>
      <div id="answers" class="answers"></div>
      <div id="feedback" class="feedback" role="status" aria-live="polite">Preparando el primer cromo…</div>
      <button id="nextBtn" class="next" >Siguiente cromo →</button>
    </div>
  </div>
</div>

<div id="loading" class="loading">
  <div class="loading-card">
    <div id="spinner" class="spinner"></div>
    <b id="loadingTitle">Preparando el álbum…</b>
    <div id="loadingText" class="small">Cargando el catálogo de cromos.</div><button id="retryBtn" class="primary" hidden>Reintentar</button>
  </div>
</div>

<div id="finish" class="overlay">
  <div class="modal">
    <div style="font-size:48px">🏆</div>
    <h2>Fin de la partida</h2>
    <div id="finalCorrect" class="score">0/10</div>
    <div id="finalPoints" style="margin-top:4px"></div>
    <button class="primary" id="playAgain">Jugar otra vez</button>
  </div>
</div>

<script type="module" src="./quien-es-game.mjs"></script>
</body>
</html>
