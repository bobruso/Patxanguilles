name: GPS report hierarchy
on:
  push:
    branches: [feature/gps-fit-mvp]
    paths: ['gps/_patch_report_hierarchy.py']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gps-fit-mvp
      - run: python gps/_patch_report_hierarchy.py
      - run: node --check gps/player-gps-panel.js && node --check gps/match-summary.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gps/player-gps-panel.js gps/gps-panel.css
          git diff --cached --quiet || git commit -m "Prioritize GPS maps and automatic match summary"
          git push
