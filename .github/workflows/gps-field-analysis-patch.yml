name: GPS calibrated field analysis patch

on:
  push:
    branches:
      - feature/gps-fit-mvp
    paths:
      - .github/workflows/gps-field-analysis-patch.yml

permissions:
  contents: write

jobs:
  patch-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gps-fit-mvp
          fetch-depth: 0
      - name: Patch FIT analysis for calibrated pitches
        shell: python
        run: |
          from pathlib import Path
          import re
          path=Path('gps/fit-analysis.js')
          text=path.read_text(encoding='utf-8')
          import_line="import{buildFieldTransform,chooseNearestPitch,normalizeAttackU}from'./field-transform.js';\n"
          if import_line not in text:
              text=import_line+text

          pattern=r"function buildPosition\(samples,\{attackDirection=1\}=\{\}\)\{.*?\n\}\n\nfunction roleEstimate"
          replacement="""function buildPosition(samples,{attackDirection=1,field=null,periods=[],firstPeriodAttack=null}={}){
            const gps=samples.filter(s=>Number.isFinite(s.lat)&&Number.isFinite(s.lon));
            const fieldTf=field?.corners?.length===4?buildFieldTransform(field.corners):null;
            const tf=fieldTf||pcaTransform(gps);if(!tf)return null;
            const fieldCalibrated=!!fieldTf,periodList=Array.isArray(periods)?periods:[],first=Number(firstPeriodAttack),canOrient=fieldCalibrated&&(first===1||first===-1)&&periodList.length>0;
            const grid=Array.from({length:GRID_Y},()=>Array(GRID_X).fill(0)),zoneGrid=Array.from({length:3},()=>Array(6).fill(0)),pts=[];
            const thirds=[0,0,0],sides=[0,0,0];let totalTime=0;
            for(const s of gps){
              let{u,v}=tf.project(s.lat,s.lon);if(!Number.isFinite(u)||!Number.isFinite(v))continue;
              if(canOrient){const oriented=normalizeAttackU(u,s.tSec,{periods:periodList,firstPeriodAttack:first});if(oriented.u==null)continue;u=oriented.u}else{u=clamp(u,0,1);if(!fieldCalibrated&&Number(attackDirection)<0)u=1-u}
              v=clamp(v,0,1);const weight=s.dt||.5;totalTime+=weight;
              grid[Math.min(GRID_Y-1,Math.floor(v*GRID_Y))][Math.min(GRID_X-1,Math.floor(u*GRID_X))]+=weight;
              zoneGrid[Math.min(2,Math.floor(v*3))][Math.min(5,Math.floor(u*6))]+=weight;
              thirds[Math.min(2,Math.floor(u*3))]+=weight;sides[Math.min(2,Math.floor(v*3))]+=weight;
              pts.push({u,v,tSec:s.tSec,dt:weight,speedKmh:s.speedKmh});
            }
            if(!pts.length)return null;
            const avgPosition={u:mean(pts.map(p=>p.u)),v:mean(pts.map(p=>p.v))};
            const step=Math.max(1,Math.ceil(pts.length/240)),trail=pts.filter((_,i)=>i%step===0||i===pts.length-1).map(p=>({u:+p.u.toFixed(4),v:+p.v.toFixed(4),tSec:+p.tSec.toFixed(1)}));
            return{grid,zoneGrid,avgPosition,trail,points:pts,thirds:thirds.map(v=>v/(totalTime||1)),sides:sides.map(v=>v/(totalTime||1)),orientationReliable:canOrient,fieldCalibrated,lengthM:fieldTf?.lengthM||null,widthM:fieldTf?.widthM||null};
          }

          function roleEstimate"""
          text,n=re.subn(pattern,replacement,text,flags=re.S)
          if n!=1:
              raise SystemExit(f'Expected one buildPosition block, found {n}')

          old="const sprintKmh=Number(options.sprintKmh)||DEFAULT_SPRINT_KMH,highIntensityKmh=Number(options.highIntensityKmh)||DEFAULT_HIGH_INTENSITY_KMH,attackDirection=Number(options.attackDirection)||1;"
          new="const sprintKmh=Number(options.sprintKmh)||DEFAULT_SPRINT_KMH,highIntensityKmh=Number(options.highIntensityKmh)||DEFAULT_HIGH_INTENSITY_KMH,attackRaw=Number(options.firstPeriodAttack??options.attackDirection),firstPeriodAttack=(attackRaw===1||attackRaw===-1)?attackRaw:null;"
          if old not in text: raise SystemExit('Could not find analyzeFit options line')
          text=text.replace(old,new,1)

          old="const sprints=detectRuns(samples,sprintKmh),hiRuns=detectRuns(samples,highIntensityKmh),highIntensityDistanceM=samples.filter(s=>s.speedKmh>=highIntensityKmh).reduce((a,s)=>a+s.dInc,0),hrs=samples.filter(s=>s.hr>0).map(s=>s.hr),pos=buildPosition(samples,{attackDirection}),refMax=Number(options.maxHr)||((Number(options.age)>0)?Math.round(208-.7*Number(options.age)):null)|| (hrs.length?Math.max(...hrs):null),accels=accelEvents(samples),cadences=samples.filter(s=>s.cadence>0).map(s=>s.cadence);"
          new="const selectedPitch=options.field||chooseNearestPitch(samples,options.fields||[]),periods=Array.isArray(options.periods)?options.periods:[],sprints=detectRuns(samples,sprintKmh),hiRuns=detectRuns(samples,highIntensityKmh),highIntensityDistanceM=samples.filter(s=>s.speedKmh>=highIntensityKmh).reduce((a,s)=>a+s.dInc,0),hrs=samples.filter(s=>s.hr>0).map(s=>s.hr),pos=buildPosition(samples,{attackDirection:firstPeriodAttack||1,field:selectedPitch,periods,firstPeriodAttack}),refMax=Number(options.maxHr)||((Number(options.age)>0)?Math.round(208-.7*Number(options.age)):null)|| (hrs.length?Math.max(...hrs):null),accels=accelEvents(samples),cadences=samples.filter(s=>s.cadence>0).map(s=>s.cadence);"
          if old not in text: raise SystemExit('Could not find positional analytics line')
          text=text.replace(old,new,1)

          old="positional:{thirds:pos?.thirds||[],sides:pos?.sides||[],role,orientationReliable:!!pos?.orientationReliable},"
          new="positional:{thirds:pos?.thirds||[],sides:pos?.sides||[],role,orientationReliable:!!pos?.orientationReliable,fieldCalibrated:!!pos?.fieldCalibrated,pitchId:selectedPitch?.id??null,pitchName:selectedPitch?.name||null,pitchDistanceFromTrackM:selectedPitch?.distanceFromTrackM??null,lengthM:pos?.lengthM??null,widthM:pos?.widthM??null,periods,firstPeriodAttack},"
          if old not in text: raise SystemExit('Could not find positional detail line')
          text=text.replace(old,new,1)

          pattern=r"export function toSupabaseRow\(matchId,playerId,a\)\{return\{.*?\}\}\n"
          replacement="""export function toSupabaseRow(matchId,playerId,a){const p=a?.analysisDetail?.positional||{};return{match_id:matchId,player_id:playerId,source_format:'fit',source_started_at:a.sourceStartedAt,duration_s:a.durationS,moving_time_s:a.movingTimeS,distance_m:a.distanceM,top_speed_kmh:a.topSpeedKmh,avg_speed_kmh:a.avgSpeedKmh,sprint_count:a.sprintCount,high_intensity_distance_m:a.highIntensityDistanceM,avg_hr:a.avgHr,max_hr:a.maxHr,sample_count:a.sampleCount,has_gps:a.hasGps,has_hr:a.hasHr,heatmap_grid:a.heatmapGrid,zone_grid:a.zoneGrid,avg_position:a.avgPosition,trail:a.trail,speed_zones:a.speedZones,analysis_detail:a.analysisDetail||{},pitch_id:p.pitchId??null,periods:p.periods||[],first_period_attack:p.firstPeriodAttack??null,analysis_version:3,updated_at:new Date().toISOString()}}
"""
          text,n=re.subn(pattern,replacement,text,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'Expected one toSupabaseRow, found {n}')
          path.write_text(text,encoding='utf-8')
      - name: Commit analysis patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gps/fit-analysis.js
          git diff --cached --quiet && exit 0
          git commit -m "Use calibrated pitches in FIT analysis"
          git push origin HEAD:feature/gps-fit-mvp
