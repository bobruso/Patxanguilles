name: GPS sync main
on:
  push:
    branches: [feature/gps-fit-mvp]
    paths: ['.github/workflows/gps-sync-main.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gps-fit-mvp
          fetch-depth: 0
      - name: Merge latest main into GPS feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git push
