name: GPS role persistence fix
on:
  push:
    branches: [feature/gps-fit-mvp]
    paths: ['.github/workflows/gps-refine-role-fix.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gps-fit-mvp
      - name: Persist and flip sprint spatial profile
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('gps/fit-analysis.js');s=p.read_text()
          s=s.replace("const role=roleEstimate(pos,{sprints:relative.sprints,durationS});\n  const detail={positional:{thirds:pos?.thirds||[],sides:pos?.sides||[],role,attackDirection", "const sprintProfile=sprintSpatialProfile(pos,relative.sprints),role=roleEstimate(pos,{sprints:relative.sprints,durationS});\n  const detail={positional:{thirds:pos?.thirds||[],sides:pos?.sides||[],sprintProfile,role,attackDirection")
          s=s.replace("p.thirds=(p.thirds||[]).slice().reverse();p.attackDirection=target;", "p.thirds=(p.thirds||[]).slice().reverse();if(p.sprintProfile?.thirds)p.sprintProfile={...p.sprintProfile,thirds:p.sprintProfile.thirds.slice().reverse()};p.attackDirection=target;")
          p.write_text(s)
          PY
          node --check gps/fit-analysis.js
          grep -q "sprintProfile,role" gps/fit-analysis.js
          grep -q "p.sprintProfile.thirds.slice().reverse" gps/fit-analysis.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gps/fit-analysis.js
          git diff --cached --quiet || git commit -m "Persist GPS sprint spatial profile"
          git push
