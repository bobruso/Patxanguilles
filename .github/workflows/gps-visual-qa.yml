name: GPS visual QA
on:
  push:
    branches: [feature/gps-fit-mvp]
    paths: ['gps/_patch_visual_maps.py']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gps-fit-mvp
      - run: python gps/_patch_visual_maps.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gps/gps-panel.css
          git diff --cached --quiet || git commit -m "Refine GPS visual hierarchy after FIT review"
          git push
