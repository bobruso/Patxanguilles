name: GPS report cleanup v2
on:
  push:
    branches: [feature/gps-fit-mvp]
    paths: ['gps/_patch_report_cleanup_v2.py']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gps-fit-mvp
      - run: python gps/_patch_report_cleanup_v2.py
      - name: Check JavaScript syntax
        run: |
          for f in gps/*.js; do node --check "$f"; done
      - name: Check inline module scripts and expected UI
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,subprocess
          for page in ['gps-upload.html','gps-report.html']:
              s=Path(page).read_text()
              for i,code in enumerate(re.findall(r'<script type="module">([\s\S]*?)</script>',s)):
                  p=Path(f'/tmp/{Path(page).stem}-{i}.mjs');p.write_text(code);subprocess.check_call(['node','--check',str(p)])
          panel=Path('gps/player-gps-panel.js').read_text()
          assert 'Carreras de alta intensidad' in panel
          assert 'MATCH HIGHLIGHTS' in panel
          assert 'data-gps-details open' in panel
          assert 'punta real del archivo' in panel
          upload=Path('gps-upload.html').read_text()
          assert 'Analizar datos' in upload and 'id="save"' not in upload
          assert 'Administrar campo habitual' not in upload
          idx=Path('gps/index-integration.js').read_text()
          assert 'Datos GPS' in idx and '⌚' in idx
          summary=Path('gps/match-summary.js').read_text()
          assert 'RESUMEN AUTOMÁTICO' not in summary
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gps/fit-analysis.js gps/match-summary.js gps/player-gps-panel.js gps/time-charts.js gps/fatigue-panel.js gps-upload.html gps/index-integration.js gps/gps-panel.css
          git diff --cached --quiet || git commit -m "Refine GPS report metrics and match UI"
          git push
