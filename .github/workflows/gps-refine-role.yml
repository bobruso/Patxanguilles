name: GPS role refinement
on:
  push:
    branches: [feature/gps-fit-mvp]
    paths: ['.github/workflows/gps-refine-role.yml']
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gps-fit-mvp
      - name: Refine role heuristic and sprint peak detail
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('gps/fit-analysis.js')
          s=p.read_text()
          marker='function roleFromFeatures('
          insert='''function sprintSpatialProfile(pos,sprints){\n  if(!pos?.points?.length||!Array.isArray(sprints)||!sprints.length)return{thirds:[0,0,0],sides:[0,0,0],count:0};\n  const thirds=[0,0,0],sides=[0,0,0];\n  for(const sp of sprints){\n    let best=pos.points[0],bestDt=Math.abs(Number(best.tSec)-Number(sp.tSec));\n    for(const pt of pos.points){const d=Math.abs(Number(pt.tSec)-Number(sp.tSec));if(d<bestDt){best=pt;bestDt=d}}\n    thirds[Math.min(2,Math.floor(clamp(Number(best.u)||0,0,0.9999)*3))]++;\n    sides[Math.min(2,Math.floor(clamp(Number(best.v)||0,0,0.9999)*3))]++;\n  }\n  const n=sprints.length||1;return{thirds:thirds.map(v=>v/n),sides:sides.map(v=>v/n),count:sprints.length};\n}\n\n'''
          if 'function sprintSpatialProfile(' not in s:s=s.replace(marker,insert+marker)
          start=s.index('function roleFromFeatures(')
          end=s.index('\nfunction speedZones',start)
          new='''function roleFromFeatures({thirds=[],sides=[],spreadU=0,spreadV=0,sprintCount=0,durationS=0,avgPosition=null,attackDirection=1,sprintThirds=[],sprintSides=[]}={}){\n  const def=thirds[0]||0,mid=thirds[1]||0,att=thirds[2]||0,left=sides[0]||0,center=sides[1]||0,right=sides[2]||0,wide=Math.max(left,right),roam=(spreadU+spreadV)/2,sprintRate=durationS?sprintCount/(durationS/60):0,sDef=sprintThirds[0]||0,sMid=sprintThirds[1]||0,sAtt=sprintThirds[2]||0,sWide=Math.max(sprintSides[0]||0,sprintSides[2]||0);\n  const roles=[\n    {role:'Delantero centro',score:att*3.1+center*1.25+sAtt*.9+sprintRate*.18+(1-def)*.45},\n    {role:'Extremo',score:att*2.05+wide*2.2+sWide*1.15+sAtt*.55+sprintRate*.25+spreadU*.7},\n    {role:'Centrocampista',score:mid*3+roam*2.2+sMid*.55+(1-Math.abs(att-def))*.65},\n    {role:'Interior / mediapunta',score:mid*1.7+att*1.9+center*.8+roam*1.3+sAtt*.45+sMid*.35},\n    {role:'Lateral / carrilero',score:def*1.45+mid*1.45+wide*2.15+sWide*.9+sDef*.35+roam*1.05},\n    {role:'Defensa central',score:def*3.05+center*1.45+sDef*.75+(1-att)*.75+(1-Math.min(1,spreadU*2))*.45}\n  ].sort((a,b)=>b.score-a.score);\n  const total=roles.reduce((s,r)=>s+Math.max(0,r.score),0)||1,top=roles[0],confidence=Math.round(100*top.score/total);\n  const notes=[];if(att>.45)notes.push('Gran parte del tiempo aparece en campo rival.');else if(def>.45)notes.push('Tendencia clara a ocupar zonas defensivas.');else notes.push('Ocupación bastante repartida alrededor del centro del campo.');\n  if(wide>.48)notes.push('Perfil muy abierto hacia banda.');if(roam>.22)notes.push('Amplio radio de acción.');if(sprintCount>=10)notes.push('Alta frecuencia de picos de sprint relativos.');if(sAtt>.5)notes.push(Math.round(sAtt*100)+'% de los picos de sprint aparecen en tercio atacante.');else if(sDef>.5)notes.push(Math.round(sDef*100)+'% de los picos de sprint aparecen en tercio defensivo.');if(sWide>.6)notes.push('Los sprints se concentran especialmente en zonas de banda.');\n  return{top:top.role,confidence,ranked:roles.slice(0,4).map(r=>({role:r.role,score:+r.score.toFixed(2)})),notes,avgU:avgPosition?+avgPosition.u.toFixed(3):null,avgV:avgPosition?+avgPosition.v.toFixed(3):null,spreadU:+spreadU.toFixed(3),spreadV:+spreadV.toFixed(3),attackDirection,sprintThirds:[sDef,sMid,sAtt],sprintSides:[sprintSides[0]||0,sprintSides[1]||0,sprintSides[2]||0]};\n}\nfunction roleEstimate(pos,ctx){\n  if(!pos)return null;const sprintProfile=sprintSpatialProfile(pos,ctx.sprints);\n  return roleFromFeatures({thirds:pos.thirds,sides:pos.sides,spreadU:std(pos.points.map(p=>p.u)),spreadV:std(pos.points.map(p=>p.v)),sprintCount:ctx.sprints.length,durationS:ctx.durationS,avgPosition:pos.avgPosition,attackDirection:pos.attackDirection,sprintThirds:sprintProfile.thirds,sprintSides:sprintProfile.sides});\n}\n'''
          s=s[:start]+new+s[end:]
          s=s.replace("const role=roleEstimate(pos,{sprints:relative.sprints,totalDistance:distanceM,durationS});\n  const detail={\n    positional:{thirds:pos?.thirds||[],sides:pos?.sides||[],role,attackDirection", "const sprintProfile=sprintSpatialProfile(pos,relative.sprints),role=roleEstimate(pos,{sprints:relative.sprints,totalDistance:distanceM,durationS});\n  const detail={\n    positional:{thirds:pos?.thirds||[],sides:pos?.sides||[],sprintProfile,role,attackDirection")
          s=s.replace("p.thirds=(p.thirds||[]).slice().reverse();\n  p.attackDirection=target;", "p.thirds=(p.thirds||[]).slice().reverse();if(p.sprintProfile?.thirds)p.sprintProfile={...p.sprintProfile,thirds:p.sprintProfile.thirds.slice().reverse()};\n  p.attackDirection=target;")
          s=s.replace("avgPosition:avg,attackDirection:target});", "avgPosition:avg,attackDirection:target,sprintThirds:p.sprintProfile?.thirds||[],sprintSides:p.sprintProfile?.sides||[]});")
          p.write_text(s)

          p=Path('gps/player-gps-panel.js');s=p.read_text()
          needle='</div><p class="patx-gps-note">Los sprints principales son relativos a la propia curva de velocidad del jugador.'
          if 'patx-gps-sprint-table' not in s:
            s=s.replace(needle, '${sprintPeakTable(speed)}'+needle)
            helper='''function sprintPeakTable(speed){const arr=(speed?.sprints||[]).slice().sort((a,b)=>Number(b.peakSpeedKmh)-Number(a.peakSpeedKmh)).slice(0,10);if(!arr.length)return'';const robust=Number(speed.robustTopKmh)||Math.max(...arr.map(x=>Number(x.peakSpeedKmh)||0),1);return `<div class="patx-gps-sprint-table" style="margin-top:14px;border:1px solid rgba(255,255,255,.08);border-radius:12px;overflow:hidden"><div style="display:grid;grid-template-columns:70px 1fr 1fr 1fr;gap:8px;padding:8px 10px;background:#111a15;color:#89958e;font-size:9px;font-weight:900;letter-spacing:.08em"><span>PICO</span><span>MOMENTO</span><span>VELOCIDAD</span><span>INTENSIDAD</span></div>${arr.map((x,i)=>{const pct=Math.max(0,Math.min(120,Math.round((Number(x.peakSpeedKmh)||0)/robust*100)));return `<div style="display:grid;grid-template-columns:70px 1fr 1fr 1fr;gap:8px;padding:9px 10px;border-top:1px solid rgba(255,255,255,.06);font-size:11px;align-items:center"><b>#${i+1}</b><span>${fmtClock(x.tSec)}</span><strong>${fmtKmh(x.peakSpeedKmh)}</strong><span>${pct}%</span></div>`}).join('')}</div>`}\nfunction fmtClock(sec){if(!finite(sec))return'—';const n=Math.max(0,Math.round(Number(sec))),m=Math.floor(n/60),s=n%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}\n'''
            s=s.replace('function hrZone(z,duration)',helper+'function hrZone(z,duration)')
          p.write_text(s)
          PY
          node --check gps/fit-analysis.js
          node --check gps/player-gps-panel.js
      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gps/fit-analysis.js gps/player-gps-panel.js
          git diff --cached --quiet || git commit -m "Refine GPS role heuristic with sprint locations"
          git push
