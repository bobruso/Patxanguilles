name: GPS habitual pitch
on:
  push:
    branches: [feature/gps-fit-mvp]
    paths: ['gps/_patch_habitual_pitch.py']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gps-fit-mvp
      - run: python gps/_patch_habitual_pitch.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re,subprocess
          for fn in ['gps-upload.html','gps-calibrate.html']:
              s=Path(fn).read_text()
              for i,code in enumerate(re.findall(r'<script type="module">([\s\S]*?)</script>',s)):
                  p=Path(f'/tmp/{Path(fn).stem}-{i}.mjs');p.write_text(code);subprocess.check_call(['node','--check',str(p)])
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gps-upload.html gps-calibrate.html
          git diff --cached --quiet || git commit -m "Use habitual pitch and open GPS report after save"
          git push
