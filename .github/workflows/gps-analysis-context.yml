name: GPS analysis context
on:
  push:
    branches: [feature/gps-fit-mvp]
    paths: ['.github/workflows/gps-analysis-context.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gps-fit-mvp
      - name: Replace misleading auto-adjust quality with explicit outlier count
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('gps/player-gps-panel.js'); s=p.read_text()
          s=s.replace("  const autoQuality=finite(pos.autoBounds?.quality)?Math.round(Number(pos.autoBounds.quality)*100):null;\n", "  const autoRejected=finite(pos.autoBounds?.rejected)?Math.round(Number(pos.autoBounds.rejected)):null;\n")
          s=s.replace("`Rectángulo robusto del recorrido${autoQuality!=null?` · calidad ${autoQuality}%`:''}`", "`Rectángulo robusto del recorrido${autoRejected!=null?` · ${autoRejected} puntos extremos ignorados`:''}`")
          p.write_text(s)
          p=Path('gps-upload.html'); s=p.read_text()
          s=s.replace("const quality=Number.isFinite(Number(pos.autoBounds?.quality))?Math.round(Number(pos.autoBounds.quality)*100):null,geo=pos.fieldCalibrated?`campo calibrado: <b>${esc(pos.pitchName||'campo guardado')}</b>`:`autoajuste GPS${quality!=null?` · calidad <b>${quality}%</b>`:''}`;", "const rejected=Number.isFinite(Number(pos.autoBounds?.rejected))?Math.round(Number(pos.autoBounds.rejected)):null,geo=pos.fieldCalibrated?`campo calibrado: <b>${esc(pos.pitchName||'campo guardado')}</b>`:`autoajuste GPS${rejected!=null?` · <b>${rejected}</b> puntos extremos ignorados`:''}`;")
          p.write_text(s)
          PY
          node --check gps/player-gps-panel.js
          python - <<'PY'
          from pathlib import Path
          import re,subprocess
          txt=Path('gps-upload.html').read_text(); b=re.findall(r'<script type="module">(.*?)</script>',txt,re.S)[0]
          f=Path('/tmp/gps-upload.mjs'); f.write_text(b); subprocess.run(['node','--check',str(f)],check=True)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gps/player-gps-panel.js gps-upload.html
          git diff --cached --quiet || git commit -m "Clarify GPS auto-adjust outlier handling"
          git push
