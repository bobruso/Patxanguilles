name: GPS multiformat polish
on:
  push:
    branches: [feature/gps-fit-mvp]
    paths: ['gps/_patch_multiformat_polish.py']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gps-fit-mvp
      - run: python gps/_patch_multiformat_polish.py
      - run: node --check gps/player-gps-panel.js && node --check gps/activity-import.js && node --check gps/fit-analysis.js
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re,subprocess
          s=Path('gps-upload.html').read_text()
          for i,code in enumerate(re.findall(r'<script type="module">([\s\S]*?)</script>',s)):
              p=Path(f'/tmp/gps-upload-polish-{i}.mjs');p.write_text(code);subprocess.check_call(['node','--check',str(p)])
          assert 'latestBuffer' not in s
          assert 'Analizar actividad' in s
          assert 'Recomendado: FIT' in s
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gps-upload.html gps/player-gps-panel.js
          git diff --cached --quiet || git commit -m "Polish multiformat GPS import UI"
          git push
