name: GPS sprint table layout fix
on:
  push:
    branches: [feature/gps-fit-mvp]
    paths: ['.github/workflows/gps-sprint-table-fix.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gps-fit-mvp
      - name: Move sprint peak table outside metric grid
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('gps/player-gps-panel.js');s=p.read_text()
          s=s.replace("${mini('Distancia / min',finite(work.distancePerMin)?Math.round(work.distancePerMin)+' m':'—')}${sprintPeakTable(speed)}</div><p class=\"patx-gps-note\">", "${mini('Distancia / min',finite(work.distancePerMin)?Math.round(work.distancePerMin)+' m':'—')}</div>${sprintPeakTable(speed)}<p class=\"patx-gps-note\">")
          p.write_text(s)
          PY
          node --check gps/player-gps-panel.js
          grep -q "</div>\${sprintPeakTable(speed)}<p class=\"patx-gps-note\"" gps/player-gps-panel.js
      - name: Commit layout fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gps/player-gps-panel.js
          git diff --cached --quiet || git commit -m "Fix GPS sprint peak table layout"
          git push
