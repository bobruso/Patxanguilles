name: GPS sprint events
on:
  push:
    branches: [feature/gps-fit-mvp]
    paths: ['gps/_patch_sprint_events.py']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gps-fit-mvp
      - run: python gps/_patch_sprint_events.py
      - run: node --check gps/fit-analysis.js && node --check gps/player-gps-panel.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gps/fit-analysis.js gps/player-gps-panel.js gps/gps-panel.css
          git diff --cached --quiet || git commit -m "Add detailed relative sprint events"
          git push
