name: GPS cleanup v3
on:
  push:
    branches: [feature/gps-fit-mvp]
    paths: ['gps/_patch_cleanup_v3.py']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gps-fit-mvp
      - run: python gps/_patch_cleanup_v3.py
      - run: |
          node --check gps/fit-analysis.js
          node --check gps/fatigue-profile.js
          node --check gps/fatigue-panel.js
          node --check gps/player-gps-panel.js
      - run: |
          python - <<'PY'
          from pathlib import Path
          panel=Path('gps/player-gps-panel.js').read_text()
          assert 'Ley Rico activada' in panel and 'Ley Rico desactivada' in panel
          assert 'HIGHLIGHTS' in panel and 'MATCH HIGHLIGHTS' not in panel
          assert 'Distancia total recorrida' in panel
          assert "stat('Sprints'" in panel
          assert 'approximateBusiestBlock' in panel
          assert 'Aceleraciones fuertes' in panel
          fatigue=Path('gps/fatigue-panel.js').read_text()
          assert "const cards=" not in fatigue
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gps/fit-analysis.js gps/fatigue-profile.js gps/fatigue-panel.js gps/player-gps-panel.js gps/gps-panel.css
          git diff --cached --quiet || git commit -m "Simplify GPS metrics and improve readability"
          git push
