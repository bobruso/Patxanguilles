name: GPS habitual calibrator
on:
  push:
    branches: [feature/gps-fit-mvp]
    paths: ['gps/_patch_calibrator_habitual.py']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gps-fit-mvp
      - run: python gps/_patch_calibrator_habitual.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re,subprocess
          s=Path('gps-calibrate.html').read_text()
          for i,code in enumerate(re.findall(r'<script type="module">([\s\S]*?)</script>',s)):
              p=Path(f'/tmp/gps-calibrate-{i}.mjs');p.write_text(code);subprocess.check_call(['node','--check',str(p)])
          assert 'draggable:true' in s
          assert 'Guardar como campo habitual' in s
          assert 'Usar como habitual' in s
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gps-calibrate.html
          git diff --cached --quiet || git commit -m "Polish habitual GPS field calibrator"
          git push
