name: Restore main index
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_restore_main_index.yml']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: |
          git checkout 8f0b6c733134700a8c9e5efd4d0b5a90de656397 -- index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore main index after interrupted publish"
          git push
