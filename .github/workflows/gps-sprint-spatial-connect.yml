name: GPS sprint spatial connect
on:
  push:
    branches: [feature/gps-fit-mvp]
    paths: ['gps/_patch_sprint_spatial.py']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gps-fit-mvp
      - run: python gps/_patch_sprint_spatial.py
      - run: node --check gps/fit-analysis.js && node --check gps/pitch-maps.js && node --check gps/player-gps-panel.js && node --check gps/sprint-spatial.js && node --check gps/sprint-spatial-panel.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gps/fit-analysis.js gps/pitch-maps.js gps/player-gps-panel.js
          git diff --cached --quiet || git commit -m "Map relative sprints onto the pitch"
          git push
