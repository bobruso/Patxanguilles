name: GPS return refresh
on:
  push:
    branches: [feature/gps-fit-mvp]
    paths: ['gps/_patch_return_refresh.py']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gps-fit-mvp
      - run: python gps/_patch_return_refresh.py
      - run: node --check gps/index-integration.js
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile
          s=Path('gps-upload.html').read_text()
          scripts=re.findall(r'<script type="module">([\s\S]*?)</script>',s)
          for i,code in enumerate(scripts):
              p=Path(f'/tmp/gps-upload-inline-{i}.mjs');p.write_text(code);subprocess.check_call(['node','--check',str(p)])
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gps-upload.html gps/index-integration.js
          git diff --cached --quiet || git commit -m "Refresh match GPS reliably after upload"
          git push
