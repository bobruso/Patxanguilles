</style><link rel="stylesheet" href="./gps/v196-overrides.css"><link rel="stylesheet" href="./gps/v198-report-enhancements.css"><link rel="stylesheet" href="./gps/v201-report-enhancements.css"><link rel="stylesheet" href="./gps/v204-report.css"><link rel="stylesheet" href="./gps/v205-report-adjustments.css"><link rel="stylesheet" href="./gps/v212-pdf.css"><link rel="stylesheet" href="./gps/v217-report-loader.css"></head><body><div id="gpsReportLoadingV217" class="gps-report-loading-v217" aria-live="polite" aria-busy="true"><div class="gps-report-loading-card-v217"><div class="gps-report-spinner-v217"></div><div class="gps-report-loading-kicker-v217">ANÁLISIS GPS</div><h2>Preparando informe…</h2><p id="gpsReportLoadingPhraseV217">Convirtiendo sufrimiento en gráficos.</p><div class="gps-report-loading-bar-v217"></div></div></div></div><main class="gps-page"><div id="gpsReport" class="gps-page-status">Cargando análisis GPS…</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module">
import{fromSupabaseRow,setAttackDirection}from'./gps/fit-analysis.js';import{mountPlayerGpsPanel}from'./gps/player-gps-panel.js';

function cloneGpsPhysical(v){
  if(v==null)return v;
  try{return structuredClone(v)}catch(e){
    try{return JSON.parse(JSON.stringify(v))}catch(_){return v}
  }
}
function setAttackDirectionKeepingMaps(current,dir){
  if(!current)return current;
  const pos=current.analysisDetail?.positional||{};
  const physical={
    heatmapGrid:cloneGpsPhysical(current.heatmapGrid),
    zoneGrid:cloneGpsPhysical(current.zoneGrid),
    avgPosition:cloneGpsPhysical(current.avgPosition),
    trail:cloneGpsPhysical(current.trail),
    sprintPoints:cloneGpsPhysical(pos.sprintPoints),
    sprintProfilePoints:cloneGpsPhysical(pos.sprintProfile?.points)
  };

  const interpreted=setAttackDirection(current,dir);
  const ipos=interpreted?.analysisDetail?.positional;

  interpreted.heatmapGrid=physical.heatmapGrid;
  interpreted.zoneGrid=physical.zoneGrid;
  interpreted.avgPosition=physical.avgPosition;
  interpreted.trail=physical.trail;

  if(ipos){
    if(physical.sprintPoints!==undefined)ipos.sprintPoints=physical.sprintPoints;
    if(ipos.sprintProfile&&physical.sprintProfilePoints!==undefined){
      ipos.sprintProfile.points=physical.sprintProfilePoints;
    }
  }
  return interpreted;
}

const sb=window.supabase.createClient('https://cnnhstlguewrxjihhlqc.supabase.co','sb_publishable_uWEwYEMkAe3YkeAzX7ACAg_0aEYHmM6',{auth:{persistSession:false}}),root=document.getElementById('gpsReport'),q=new URLSearchParams(location.search),matchId=q.get('match'),playerId=q.get('player');let analysis=null,playerName='Jugador',match=null;
function setOrientationState(text,isError=false){const el=root.querySelector('[data-gps-orientation-state]');if(!el)return;el.textContent=text||'';el.classList.toggle('is-error',!!isError)}function bind(){const back=root.querySelector('[data-gps-back]');if(back)back.onclick=()=>history.length>1?history.back():location.assign('./index.html');root.querySelectorAll('[data-gps-dir]').forEach(btn=>btn.onclick=async()=>{const dir=Number(btn.dataset.gpsDir)===-1?-1:1;if(analysis?.analysisDetail?.positional?.attackDirection===dir)return;analysis=setAttackDirectionKeepingMaps(analysis,dir);render();setOrientationState('Guardando Ley Rico…');const{error}=await sb.from('match_player_gps').update({attack_direction:dir,heatmap_grid:analysis.heatmapGrid,zone_grid:analysis.zoneGrid,avg_position:analysis.avgPosition,trail:analysis.trail,analysis_detail:analysis.analysisDetail,updated_at:new Date().toISOString()}).eq('match_id',matchId).eq('player_id',playerId);if(error){console.warn('[GPS] No se pudo guardar Ley Rico',error);setOrientationState('No se pudo guardar',true)}else setOrientationState('Ley Rico guardada')})}
function render(){root.className='';mountPlayerGpsPanel(root,analysis,{playerName,showBack:true,showOrientation:true});window.__patxGpsAnalysis=analysis;window.__patxGpsSupabase=sb;window.__patxGpsMatch=match;window.dispatchEvent(new CustomEvent('patx-gps-analysis-updated'));bind();if(match){const kicker=root.querySelector('.patx-gps-kicker');if(kicker)kicker.textContent=`${match.match_date} · ${match.competition==='football7'?'FÚTBOL 7':'FÚTBOL SALA'} · GPS`}}
async function load(){if(!matchId||!playerId){root.textContent='Falta el partido o el jugador.';return}const[{data:g,error:ge},{data:p},{data:m}]=await Promise.all([sb.from('match_player_gps').select('*').eq('match_id',matchId).eq('player_id',playerId).maybeSingle(),sb.from('players').select('nickname').eq('id',playerId).maybeSingle(),sb.from('matches').select('match_date,competition,red_score,black_score').eq('id',matchId).maybeSingle()]);if(ge||!g){root.textContent='Este jugador todavía no tiene datos GPS guardados para este partido.';return}analysis=fromSupabaseRow(g);playerName=p?.nickname||'Jugador';match=m;document.title=`${playerName} · GPS · Patxanguilles`;render()}load();
</script><script src="./gps/v196-overrides.js"></script><script type="module" src="./gps/v201-report-enhancements.js"></script><script type="module" src="./gps/v204-report.js"></script><script src="./gps/v205-report-adjustments.js"></script><script src="./gps/v212-pdf.js"></script><script src="./gps/v220-report-loader.js"></script></body></html>
