<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07100b"><title>Análisis GPS · Patxanguilles</title><link rel="stylesheet" href="./gps/gps-panel.css"><style>
html,body{min-height:100%;margin:0}body{background:#07100b url('background-home.jpg') center/cover fixed no-repeat;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}body:before{content:"";position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:-1}.gps-page{width:auto;max-width:none;margin:14px 16px 40px}.gps-page .patx-gps-panel{max-width:none;margin:0}.gps-page-status{padding:25px;border-radius:18px;background:rgba(8,14,11,.82);border:1px solid rgba(255,255,255,.13);color:#aab5ae}@media(min-width:1500px){.gps-page{margin-left:24px;margin-right:24px}}@media(max-width:650px){.gps-page{margin:8px 8px 26px}}
</style><link rel="stylesheet" href="./gps/v196-overrides.css"></head><body><main class="gps-page"><div id="gpsReport" class="gps-page-status">Cargando análisis GPS…</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module">
import{fromSupabaseRow,setAttackDirection}from'./gps/fit-analysis.js';import{mountPlayerGpsPanel}from'./gps/player-gps-panel.js';
const sb=window.supabase.createClient('https://cnnhstlguewrxjihhlqc.supabase.co','sb_publishable_uWEwYEMkAe3YkeAzX7ACAg_0aEYHmM6',{auth:{persistSession:false}}),root=document.getElementById('gpsReport'),q=new URLSearchParams(location.search),matchId=q.get('match'),playerId=q.get('player');let analysis=null,playerName='Jugador',match=null;
function setOrientationState(text,isError=false){const el=root.querySelector('[data-gps-orientation-state]');if(!el)return;el.textContent=text||'';el.classList.toggle('is-error',!!isError)}function bind(){const back=root.querySelector('[data-gps-back]');if(back)back.onclick=()=>history.length>1?history.back():location.assign('./index.html');root.querySelectorAll('[data-gps-dir]').forEach(btn=>btn.onclick=async()=>{const dir=Number(btn.dataset.gpsDir)===-1?-1:1;if(analysis?.analysisDetail?.positional?.attackDirection===dir)return;analysis=setAttackDirection(analysis,dir);render();setOrientationState('Guardando Ley Rico…');const{error}=await sb.from('match_player_gps').update({attack_direction:dir,heatmap_grid:analysis.heatmapGrid,zone_grid:analysis.zoneGrid,avg_position:analysis.avgPosition,trail:analysis.trail,analysis_detail:analysis.analysisDetail,updated_at:new Date().toISOString()}).eq('match_id',matchId).eq('player_id',playerId);if(error){console.warn('[GPS] No se pudo guardar Ley Rico',error);setOrientationState('No se pudo guardar',true)}else setOrientationState('Ley Rico guardada')})}
function render(){root.className='';mountPlayerGpsPanel(root,analysis,{playerName,showBack:true,showOrientation:true});bind();if(match){const kicker=root.querySelector('.patx-gps-kicker');if(kicker)kicker.textContent=`${match.match_date} · ${match.competition==='football7'?'FÚTBOL 7':'FÚTBOL SALA'} · GPS`}}
async function load(){if(!matchId||!playerId){root.textContent='Falta el partido o el jugador.';return}const[{data:g,error:ge},{data:p},{data:m}]=await Promise.all([sb.from('match_player_gps').select('*').eq('match_id',matchId).eq('player_id',playerId).maybeSingle(),sb.from('players').select('nickname').eq('id',playerId).maybeSingle(),sb.from('matches').select('match_date,competition,red_score,black_score').eq('id',matchId).maybeSingle()]);if(ge||!g){root.textContent='Este jugador todavía no tiene datos GPS guardados para este partido.';return}analysis=fromSupabaseRow(g);playerName=p?.nickname||'Jugador';match=m;document.title=`${playerName} · GPS · Patxanguilles`;render()}load();
</script><script src="./gps/v196-overrides.js"></script></body></html>
