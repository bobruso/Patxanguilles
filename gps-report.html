<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07100b">
<title>Análisis GPS · Patxanguilles</title>
<link rel="stylesheet" href="./gps/gps-panel.css">
<style>body{margin:0;background:#07100b url('background-home.jpg') center/cover fixed no-repeat;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}body:before{content:"";position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:-1}.gps-page{width:min(1180px,calc(100% - 24px));margin:18px auto 40px}.gps-page-status{padding:25px;border-radius:18px;background:rgba(8,14,11,.82);border:1px solid rgba(255,255,255,.13);color:#aab5ae}</style>
</head>
<body><main class="gps-page"><div id="gpsReport" class="gps-page-status">Cargando análisis GPS…</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module">
import{fromSupabaseRow}from'./gps/fit-analysis.js';
import{mountPlayerGpsPanel}from'./gps/player-gps-panel.js';
const sb=window.supabase.createClient('https://cnnhstlguewrxjihhlqc.supabase.co','sb_publishable_uWEwYEMkAe3YkeAzX7ACAg_0aEYHmM6',{auth:{persistSession:false}}),root=document.getElementById('gpsReport'),q=new URLSearchParams(location.search),matchId=q.get('match'),playerId=q.get('player');
async function load(){if(!matchId||!playerId){root.textContent='Falta el partido o el jugador.';return}const[{data:g,error:ge},{data:p},{data:m}]=await Promise.all([sb.from('match_player_gps').select('*').eq('match_id',matchId).eq('player_id',playerId).maybeSingle(),sb.from('players').select('nickname').eq('id',playerId).maybeSingle(),sb.from('matches').select('match_date,competition,red_score,black_score').eq('id',matchId).maybeSingle()]);if(ge||!g){root.textContent='Este jugador todavía no tiene datos GPS guardados para este partido.';return}root.className='';mountPlayerGpsPanel(root,fromSupabaseRow(g),{playerName:p?.nickname||'Jugador',showBack:true});const back=root.querySelector('[data-gps-back]');if(back)back.onclick=()=>history.length>1?history.back():location.assign('./index.html');if(m){document.title=`${p?.nickname||'Jugador'} · GPS · Patxanguilles`;const kicker=root.querySelector('.patx-gps-kicker');if(kicker)kicker.textContent=`${m.match_date} · ${m.competition==='football7'?'FÚTBOL 7':'FÚTBOL SALA'} · GPS`}}
load();
</script></body></html>
