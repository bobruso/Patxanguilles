<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Patxanguilles GPS FIT MVP</title>
  <link rel="stylesheet" href="./gps/gps-panel.css">
  <style>
    body{font-family:system-ui;background:#08110d;color:#fff;margin:0;padding:24px}.wrap{max-width:1180px;margin:auto}.card{background:#111a15;border:1px solid #2d3a32;border-radius:18px;padding:20px;margin:16px 0}select,input,button{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid #405047;background:#17231c;color:#fff}button{cursor:pointer;font-weight:800}.muted{color:#9eaaa3}.ok{color:#62df7b}.err{color:#ff6b6b}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.controls label{display:flex;gap:7px;align-items:center}h1{margin-bottom:5px}
  </style>
</head>
<body>
<div class="wrap">
  <h1>Patxanguilles · GPS/FIT MVP</h1>
  <p class="muted">El FIT se procesa en tu navegador. Se guardan métricas y coordenadas normalizadas del campo, no latitud/longitud originales.</p>
  <div class="card">
    <div class="controls">
      <label>Partido <select id="match"></select></label>
      <label>Jugador <select id="player"></select></label>
      <input id="fit" type="file" accept=".fit,application/octet-stream">
      <button id="analyze">Analizar FIT</button>
      <button id="save" disabled>Guardar en Supabase</button>
    </div>
    <div id="status" class="muted" style="margin-top:12px"></div>
  </div>
  <div id="result" hidden></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module">
  import{analyzeFit,toSupabaseRow}from'./gps-fit-mvp.js';
  import{mountPlayerGpsPanel}from'./gps/player-gps-panel.js';
  const sb=window.supabase.createClient('https://cnnhstlguewrxjihhlqc.supabase.co','sb_publishable_uWEwYEMkAe3YkeAzX7ACAg_0aEYHmM6',{auth:{persistSession:false}});
  const $=id=>document.getElementById(id);let latest=null,playersByMatch={};
  async function load(){
    const[{data:m,error:me},{data:p,error:pe},{data:mp,error:mpe}]=await Promise.all([
      sb.from('matches').select('id,match_date,competition,status').order('match_date',{ascending:false}).limit(30),
      sb.from('players').select('id,nickname'),
      sb.from('match_players').select('match_id,player_id,team')
    ]);
    if(me||pe||mpe){$('status').textContent='Error cargando datos de Supabase';return}
    const names=Object.fromEntries(p.map(x=>[String(x.id),x.nickname]));playersByMatch={};
    for(const row of mp)(playersByMatch[String(row.match_id)]??=[]).push({id:row.player_id,name:names[String(row.player_id)]||row.player_id,team:row.team});
    $('match').innerHTML=m.map(x=>`<option value="${x.id}">${x.match_date} · ${x.competition} · ${x.status}</option>`).join('');updatePlayers();
  }
  function updatePlayers(){const rows=playersByMatch[$('match').value]||[];$('player').innerHTML=rows.map(x=>`<option value="${x.id}">${x.name} · ${x.team==='red'?'Rojo':'Negro'}</option>`).join('')}
  $('match').addEventListener('change',updatePlayers);
  $('analyze').onclick=async()=>{
    const f=$('fit').files[0];if(!f)return $('status').textContent='Selecciona un archivo .fit';
    $('status').textContent='Analizando…';
    try{
      latest=await analyzeFit(await f.arrayBuffer());
      $('result').hidden=false;
      const name=$('player').selectedOptions[0]?.textContent?.split(' · ')[0]||'Jugador';
      mountPlayerGpsPanel($('result'),latest,{playerName:name});
      $('save').disabled=false;$('status').innerHTML='<span class="ok">FIT analizado correctamente.</span>';
    }catch(e){console.error(e);$('status').innerHTML='<span class="err">'+String(e?.message||e)+'</span>'}
  };
  $('save').onclick=async()=>{
    if(!latest)return;
    const row=toSupabaseRow(Number($('match').value),Number($('player').value),latest);
    const{error}=await sb.from('match_player_gps').upsert(row,{onConflict:'match_id,player_id'});
    $('status').innerHTML=error?'<span class="err">No se pudo guardar: '+error.message+'</span>':'<span class="ok">Datos GPS guardados en el partido.</span>';
  };
  load();
</script>
</body>
</html>
