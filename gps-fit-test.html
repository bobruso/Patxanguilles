<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patxanguilles GPS FIT MVP</title><style>body{font-family:system-ui;background:#08110d;color:#fff;margin:0;padding:24px}.wrap{max-width:900px;margin:auto}.card{background:#111a15;border:1px solid #2d3a32;border-radius:18px;padding:20px;margin:16px 0}select,input,button{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid #405047;background:#17231c;color:#fff}button{cursor:pointer;font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.stat{background:#0c1510;padding:14px;border-radius:12px}.stat b{display:block;font-size:24px}.muted{color:#9eaaa3}canvas{width:100%;height:auto;background:#0b1c11;border-radius:14px}.ok{color:#62df7b}.err{color:#ff6b6b}</style></head><body><div class="wrap"><h1>Patxanguilles · GPS/FIT MVP</h1><p class="muted">Prueba aislada. El FIT se procesa en tu navegador; no se suben coordenadas GPS originales.</p><div class="card"><label>Partido <select id="match"></select></label> <label>Jugador <select id="player"></select></label><p><input id="fit" type="file" accept=".fit,application/octet-stream"> <button id="analyze">Analizar FIT</button> <button id="save" disabled>Guardar en Supabase</button></p><div id="status" class="muted"></div></div><div id="result" class="card" hidden><div class="grid"><div class="stat"><span>Distancia</span><b id="distance">—</b></div><div class="stat"><span>Velocidad máxima</span><b id="top">—</b></div><div class="stat"><span>Velocidad media</span><b id="avg">—</b></div><div class="stat"><span>Sprints &gt;18 km/h</span><b id="sprints">—</b></div><div class="stat"><span>FC media</span><b id="hravg">—</b></div><div class="stat"><span>FC máxima</span><b id="hrmax">—</b></div></div><h3>Mapa de calor</h3><canvas id="heatmap" width="900" height="560"></canvas></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module">import{analyzeFit,drawHeatmap,toSupabaseRow}from'./gps-fit-mvp.js';const sb=window.supabase.createClient('https://cnnhstlguewrxjihhlqc.supabase.co','sb_publishable_uWEwYEMkAe3YkeAzX7ACAg_0aEYHmM6',{auth:{persistSession:false}}),$=id=>document.getElementById(id);let latest=null,playersByMatch={};async function load(){const[{data:m,error:me},{data:p,error:pe},{data:mp,error:mpe}]=await Promise.all([sb.from('matches').select('id,match_date,competition,status').order('match_date',{ascending:false}).limit(30),sb.from('players').select('id,nickname'),sb.from('match_players').select('match_id,player_id,team')]);if(me||pe||mpe){$('status').textContent='Error cargando datos de Supabase';return}const names=Object.fromEntries(p.map(x=>[String(x.id),x.nickname]));playersByMatch={};for(const row of mp)(playersByMatch[String(row.match_id)]??=[]).push({id:row.player_id,name:names[String(row.player_id)]||row.player_id,team:row.team});$('match').innerHTML=m.map(x=>`<option value="${x.id}">${x.match_date} · ${x.competition} · ${x.status}</option>`).join('');updatePlayers()}function updatePlayers(){const rows=playersByMatch[$('match').value]||[];$('player').innerHTML=rows.map(x=>`<option value="${x.id}">${x.name} · ${x.team==='red'?'Rojo':'Negro'}</option>`).join('')}$('match').addEventListener('change',updatePlayers);$('analyze').onclick=async()=>{const f=$('fit').files[0];if(!f)return $('status').textContent='Selecciona un archivo .fit';$('status').textContent='Analizando…';try{latest=await analyzeFit(await f.arrayBuffer());$('distance').textContent=(latest.distanceM/1000).toFixed(2)+' km';$('top').textContent=latest.topSpeedKmh.toFixed(1)+' km/h';$('avg').textContent=latest.avgSpeedKmh.toFixed(1)+' km/h';$('sprints').textContent=latest.sprintCount;$('hravg').textContent=latest.avgHr??'—';$('hrmax').textContent=latest.maxHr??'—';$('result').hidden=false;drawHeatmap($('heatmap'),latest);$('save').disabled=false;$('status').innerHTML='<span class="ok">FIT analizado correctamente.</span>'}catch(e){console.error(e);$('status').innerHTML='<span class="err">'+String(e?.message||e)+'</span>'}};$('save').onclick=async()=>{if(!latest)return;const row=toSupabaseRow(Number($('match').value),Number($('player').value),latest),{error}=await sb.from('match_player_gps').upsert(row,{onConflict:'match_id,player_id'});$('status').innerHTML=error?'<span class="err">No se pudo guardar: '+error.message+'</span>':'<span class="ok">Datos GPS guardados en el partido.</span>'};load();</script></body></html>
