<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07090d">
  <title>Reto del día · Patxanguilles</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="stylesheet" href="./css/retos.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="back" href="../">← Patxanguilles</a>
      <div id="identity" class="identity">Comprobando cuenta…</div>
    </header>

    <section class="hero">
      <div class="eyebrow">RETO DEL DÍA</div>
      <h1 id="heroName">Cargando…</h1>
      <p id="heroDescription" class="description">Preparando el reto de hoy.</p>
      <div id="demoBadge" class="demo-badge" hidden>MODO DEMO · NO GUARDA</div>
    </section>

    <section id="challengePanel" class="panel challenge-panel loading">
      <div class="stats">
        <div class="stat">
          <div class="stat-label">Tu mejor marca</div>
          <div id="bestValue" class="stat-value">—</div>
        </div>
        <div class="stat">
          <div class="stat-label">Intentos</div>
          <div id="attemptsValue" class="stat-value">—</div>
        </div>
        <div class="stat">
          <div class="stat-label">Tipo</div>
          <div id="categoryValue" class="stat-value">—</div>
        </div>
      </div>
      <button id="playButton" class="play-button" type="button" disabled>CARGANDO…</button>
      <p id="microcopy" class="microcopy">Validando sesión y reto.</p>
    </section>

    <div id="errorBox" class="error-box" hidden></div>

    <section id="gamePanel" class="panel game-panel" hidden>
      <div class="game-header">
        <div id="gameTitle" class="game-title">Juego</div>
        <div id="gameAttempt" class="game-attempt"></div>
      </div>
      <div id="gameStage" class="game-stage"></div>
    </section>

    <section id="resultPanel" class="panel result-panel" hidden>
      <div id="resultLabel" class="result-label">RESULTADO</div>
      <div id="resultScore" class="result-score">—</div>
      <p id="resultCopy" class="result-copy"></p>
    </section>

    <section class="leaderboard">
      <div class="section-head">
        <h2>Clasificación de hoy</h2>
        <div class="section-note">Mejor intento de cada jugador</div>
      </div>
      <div id="ranking" class="panel ranking">
        <div class="empty">Cargando clasificación…</div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../auth/config.js"></script>
  <script src="../auth/auth-service.js"></script>
  <script src="./js/services/challenge-service.js"></script>
  <script src="./js/core/game-registry.js"></script>
  <script src="./js/games/stop-seven.js"></script>
  <script src="./js/games/reaction.js"></script>
  <script src="./js/games/center-hit.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
