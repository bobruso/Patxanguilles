<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07100b"><title>Subir GPS · Patxanguilles</title><link rel="stylesheet" href="./gps/gps-panel.css"><style>body{margin:0;background:#07100b url('background-home.jpg') center/cover fixed no-repeat;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}body:before{content:"";position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:-1}.wrap{width:min(1180px,calc(100% - 24px));margin:18px auto 40px}.upload-card{padding:18px;border-radius:18px;background:rgba(8,14,11,.9);border:1px solid rgba(255,255,255,.13)}.row{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.row select,.row input,.row button{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid #3b4941;background:#121c16;color:#fff}.row button{cursor:pointer;font-weight:850}.primary{background:#f3f5f7!important;color:#09100c!important}.status{margin-top:10px;color:#9eaaa3}.privacy{font-size:11px;color:#8e9992;line-height:1.45}</style></head><body><main class="wrap"><section class="upload-card"><div class="patx-gps-kicker">AÑADIR DATOS GPS</div><h1 style="margin:4px 0 8px">Importar archivo .FIT</h1><p class="privacy">El archivo se analiza localmente en este dispositivo. Patxanguilles guarda las métricas y el campo normalizado, pero no las coordenadas GPS originales.</p><div class="row"><label>Jugador <select id="player"></select></label><input id="fit" type="file" accept=".fit,application/octet-stream"><button id="analyze" class="primary">Analizar FIT</button><button id="save" disabled>Guardar</button><button id="back">Volver</button></div><div id="status" class="status"></div></section><div id="result" hidden></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module">
import{analyzeFit,toSupabaseRow}from'./gps/fit-analysis.js';import{mountPlayerGpsPanel}from'./gps/player-gps-panel.js';
const sb=window.supabase.createClient('https://cnnhstlguewrxjihhlqc.supabase.co','sb_publishable_uWEwYEMkAe3YkeAzX7ACAg_0aEYHmM6',{auth:{persistSession:false}}),$=id=>document.getElementById(id),q=new URLSearchParams(location.search),matchId=q.get('match');let latest=null,players={};
async function load(){if(!matchId){$('status').textContent='Falta el identificador del partido.';return}const[{data:mp,error},{data:p}]=await Promise.all([sb.from('match_players').select('player_id,team').eq('match_id',matchId),sb.from('players').select('id,nickname,age')]);if(error){$('status').textContent='No se pudo cargar la alineación.';return}players=Object.fromEntries((p||[]).map(x=>[String(x.id),x]));$('player').innerHTML=(mp||[]).map(x=>`<option value="${x.player_id}">${players[String(x.player_id)]?.nickname||x.player_id} · ${x.team==='red'?'Rojo':'Negro'}</option>`).join('')}
$('analyze').onclick=async()=>{const f=$('fit').files[0];if(!f)return $('status').textContent='Selecciona un .fit';const p=players[$('player').value]||{};$('status').textContent='Analizando…';try{latest=await analyzeFit(await f.arrayBuffer(),{age:p.age||null});$('result').hidden=false;mountPlayerGpsPanel($('result'),latest,{playerName:p.nickname||'Jugador',showSave:false});$('save').disabled=false;$('status').textContent='Análisis listo. Revisa los datos antes de guardar.'}catch(e){console.error(e);$('status').textContent=e?.message||'No se pudo analizar el FIT'}};
$('save').onclick=async()=>{if(!latest)return;const{error}=await sb.from('match_player_gps').upsert(toSupabaseRow(Number(matchId),Number($('player').value),latest),{onConflict:'match_id,player_id'});if(error){$('status').textContent='No se pudo guardar: '+error.message;return}$('status').textContent='Datos GPS guardados.';setTimeout(()=>history.length>1?history.back():location.assign('./index.html'),650)};$('back').onclick=()=>history.length>1?history.back():location.assign('./index.html');load();
</script></body></html>
