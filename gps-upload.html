<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07100b"><title>Subir GPS · Patxanguilles</title><link rel="stylesheet" href="./gps/gps-panel.css"><style>body{margin:0;background:#07100b url('background-home.jpg') center/cover fixed no-repeat;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}body:before{content:"";position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:-1}.wrap{width:min(1500px,calc(100% - 24px));margin:18px auto 40px}.upload-card{padding:18px;border-radius:18px;background:rgba(8,14,11,.9);border:1px solid rgba(255,255,255,.13)}.row{display:flex;flex-wrap:wrap;gap:9px;align-items:end}.row label{display:grid;gap:5px;font-size:11px;color:#aab4ae}.row select,.row input,.row button{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid #3b4941;background:#121c16;color:#fff}.row button{cursor:pointer;font-weight:850}.primary{background:#f3f5f7!important;color:#09100c!important}.status{margin-top:10px;color:#9eaaa3}.privacy{font-size:11px;color:#8e9992;line-height:1.45}.field-info{margin-top:12px;padding:10px 12px;border-radius:11px;background:#101a14;border:1px solid rgba(255,255,255,.08);font-size:11px;color:#aab5ae}.small-link{color:#8bd2ff;text-decoration:none;font-size:11px}@media(max-width:650px){.row{display:grid}.row label,.row select,.row input,.row button{width:100%}}</style></head><body><main class="wrap"><section class="upload-card"><div class="patx-gps-kicker">AÑADIR DATOS GPS</div><h1 style="margin:4px 0 8px">Importar actividad GPS</h1><p class="privacy">El archivo se analiza localmente. Admite FIT, GPX y TCX. Se guardan métricas y posiciones normalizadas, nunca las coordenadas GPS originales ni el archivo original.</p><div class="row"><label>Jugador <select id="player"></select></label><label>Archivo <input id="fit" type="file" accept=".fit,.gpx,.tcx,application/octet-stream,application/gpx+xml,application/vnd.garmin.tcx+xml"></label><button id="analyze" class="primary">Analizar FIT</button><button id="save" disabled>Guardar</button><button id="back">Volver</button></div><div id="fieldInfo" class="field-info">Cargando campo habitual…</div><div id="status" class="status"></div><div style="margin-top:9px"><a class="small-link" href="gps-calibrate.html">Administrar campo habitual</a></div></section><div id="result" hidden></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module">
import{toSupabaseRow,setAttackDirection}from'./gps/fit-analysis.js';import{analyzeActivityFile,detectActivityFormat}from'./gps/activity-import.js';import{mountPlayerGpsPanel}from'./gps/player-gps-panel.js';
const sb=window.supabase.createClient('https://cnnhstlguewrxjihhlqc.supabase.co','sb_publishable_uWEwYEMkAe3YkeAzX7ACAg_0aEYHmM6',{auth:{persistSession:false}}),$=id=>document.getElementById(id),q=new URLSearchParams(location.search),matchId=q.get('match');let latest=null,analyzedPlayerId=null,players={},pitches=[],match=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function modeFromMatch(m){return m?.competition==='football5'?'fs':'f7'}function usablePitches(){const mode=modeFromMatch(match);return pitches.filter(p=>p.mode===mode&&p.is_active!==false)}
function renderPitches(){const mode=modeFromMatch(match),usable=usablePitches();$('fieldInfo').innerHTML=usable.length===1?`Campo habitual: <b>${esc(usable[0].name)}</b> · ${mode==='f7'?'Fútbol 7':'Fútbol Sala'}. Se aplicará automáticamente a todos los archivos.`:usable.length>1?`Hay <b>${usable.length}</b> campos activos. No tienes que elegir: se detectará automáticamente el más cercano al recorrido.`:'<b>Campo habitual aún no calibrado.</b> El análisis puede hacerse con autoajuste GPS, pero para máxima precisión conviene marcar una vez las 4 esquinas desde Administración.'}
function baseOptions(){const p=players[$('player').value]||{},usable=usablePitches();return{age:p.age||null,field:usable.length===1?usable[0]:null,fields:usable.length>1?usable:[],attackDirection:1}}
function resetAnalysis(){latest=null;latestBuffer=null;analyzedPlayerId=null;$('save').disabled=true;$('result').hidden=true;$('status').textContent=''}
async function load(){if(!matchId){$('status').textContent='Falta el identificador del partido.';return}const[{data:mp,error},{data:p},{data:m},{data:gp,error:gpe}]=await Promise.all([sb.from('match_players').select('player_id,team').eq('match_id',matchId),sb.from('players').select('id,nickname,age'),sb.from('matches').select('id,competition,match_date').eq('id',matchId).maybeSingle(),sb.from('gps_pitches').select('id,name,mode,corners,center_lat,center_lon,match_radius_m,is_active,goal_a_label,goal_b_label').eq('is_active',true)]);if(error){$('status').textContent='No se pudo cargar la alineación.';return}match=m;players=Object.fromEntries((p||[]).map(x=>[String(x.id),x]));pitches=gpe?[]:(gp||[]);$('player').innerHTML=(mp||[]).map(x=>`<option value="${x.player_id}">${esc(players[String(x.player_id)]?.nickname||x.player_id)} · ${x.team==='red'?'Rojo':'Negro'}</option>`).join('');renderPitches()}
function bindOrientation(){document.querySelectorAll('#result [data-gps-dir]').forEach(btn=>btn.onclick=()=>{const dir=Number(btn.dataset.gpsDir)===-1?-1:1;latest=setAttackDirection(latest,dir);renderAnalysis()})}
function renderAnalysis(){const p=players[$('player').value]||{};$('result').hidden=false;mountPlayerGpsPanel($('result'),latest,{playerName:p.nickname||'Jugador',showOrientation:true});bindOrientation();$('save').disabled=false;const pos=latest.analysisDetail?.positional||{},s=latest.analysisDetail?.speed||{};const rejected=Number.isFinite(Number(pos.autoBounds?.rejected))?Math.round(Number(pos.autoBounds.rejected)):null,geo=pos.fieldCalibrated?`campo calibrado: <b>${esc(pos.pitchName||'campo guardado')}</b>`:`autoajuste GPS${rejected!=null?` · <b>${rejected}</b> puntos extremos ignorados`:''}`;$('status').innerHTML=`Análisis listo · ${geo} · <b>${latest.sprintCount}</b> sprints relativos${Number.isFinite(Number(s.relativeSprintCutoffKmh))?` (umbral ≈ ${Number(s.relativeSprintCutoffKmh).toFixed(1)} km/h)`:''} · ${s.absoluteSprintCount18??0} esfuerzos &gt;18 km/h.`}
$('analyze').onclick=async()=>{const f=$('fit').files[0];if(!f)return $('status').textContent='Selecciona un archivo FIT, GPX o TCX';$('status').textContent=`Analizando ${String(detectActivityFormat(f)||'archivo').toUpperCase()}…`;try{analyzedPlayerId=$('player').value;latest=await analyzeActivityFile(f,baseOptions());renderAnalysis()}catch(e){console.error(e);$('status').textContent=e?.message||'No se pudo analizar el FIT'}};
$('save').onclick=async()=>{if(!latest||!analyzedPlayerId)return;if(String(analyzedPlayerId)!==String($('player').value))return $('status').textContent='Has cambiado de jugador. Vuelve a analizar el FIT.';const{error}=await sb.from('match_player_gps').upsert(toSupabaseRow(Number(matchId),Number(analyzedPlayerId),latest),{onConflict:'match_id,player_id'});if(error){$('status').textContent='No se pudo guardar: '+error.message;return}$('status').textContent='Datos GPS guardados. Abriendo informe…';setTimeout(()=>location.assign(`gps-report.html?match=${encodeURIComponent(matchId)}&player=${encodeURIComponent(analyzedPlayerId)}`),250)};$('player').addEventListener('change',resetAnalysis);$('back').onclick=()=>history.length>1?history.back():location.assign('./index.html');load();
</script></body></html>
