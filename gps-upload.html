<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07100b"><title>Subir GPS · Patxanguilles</title><link rel="stylesheet" href="./gps/gps-panel.css"><style>body{margin:0;background:#07100b url('background-home.jpg') center/cover fixed no-repeat;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}body:before{content:"";position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:-1}.wrap{width:min(1180px,calc(100% - 24px));margin:18px auto 40px}.upload-card{padding:18px;border-radius:18px;background:rgba(8,14,11,.9);border:1px solid rgba(255,255,255,.13)}.row{display:flex;flex-wrap:wrap;gap:9px;align-items:end}.row label{display:grid;gap:5px;font-size:11px;color:#aab4ae}.row select,.row input,.row button{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid #3b4941;background:#121c16;color:#fff}.row button{cursor:pointer;font-weight:850}.primary{background:#f3f5f7!important;color:#09100c!important}.status{margin-top:10px;color:#9eaaa3}.privacy{font-size:11px;color:#8e9992;line-height:1.45}.field-info{margin-top:12px;padding:10px 12px;border-radius:11px;background:#101a14;border:1px solid rgba(255,255,255,.08);font-size:11px;color:#aab5ae}.field-info b{color:#fff}.small-link{color:#8bd2ff;text-decoration:none;font-size:11px}.small-link:hover{text-decoration:underline}@media(max-width:650px){.row{display:grid}.row label,.row select,.row input,.row button{width:100%}}</style></head><body><main class="wrap"><section class="upload-card"><div class="patx-gps-kicker">AÑADIR DATOS GPS</div><h1 style="margin:4px 0 8px">Importar archivo .FIT</h1><p class="privacy">El archivo se analiza localmente en este dispositivo. Patxanguilles guarda las métricas y el campo normalizado, pero no las coordenadas GPS originales.</p><div class="row"><label>Jugador <select id="player"></select></label><label>Campo <select id="pitch"><option value="auto">Auto · detectar por GPS</option><option value="none">Sin calibrar</option></select></label><label>Archivo FIT <input id="fit" type="file" accept=".fit,application/octet-stream"></label><button id="analyze" class="primary">Analizar FIT</button><button id="save" disabled>Guardar</button><button id="back">Volver</button></div><div id="fieldInfo" class="field-info">Cargando campos calibrados…</div><div id="status" class="status"></div><div style="margin-top:9px"><a class="small-link" href="gps-calibrate.html">Administrar / calibrar campos</a></div></section><div id="result" hidden></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module">
import{analyzeFit,toSupabaseRow}from'./gps/fit-analysis.js';import{mountPlayerGpsPanel}from'./gps/player-gps-panel.js';
const sb=window.supabase.createClient('https://cnnhstlguewrxjihhlqc.supabase.co','sb_publishable_uWEwYEMkAe3YkeAzX7ACAg_0aEYHmM6',{auth:{persistSession:false}}),$=id=>document.getElementById(id),q=new URLSearchParams(location.search),matchId=q.get('match');let latest=null,players={},pitches=[],match=null;
function modeFromMatch(m){return m?.competition==='football5'?'fs':'f7'}
function renderPitches(){const mode=modeFromMatch(match),usable=pitches.filter(p=>p.mode===mode&&p.is_active!==false);$('pitch').innerHTML='<option value="auto">Auto · detectar por GPS</option>'+usable.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')+'<option value="none">Sin calibrar</option>';$('fieldInfo').innerHTML=usable.length?`Hay <b>${usable.length}</b> campo${usable.length===1?'':'s'} calibrado${usable.length===1?'':'s'} para ${mode==='f7'?'Fútbol 7':'Fútbol Sala'}. En modo Auto se escogerá el más cercano al recorrido GPS.`:'Todavía no hay campos calibrados para este formato. El mapa se generará por la forma del recorrido y la orientación ataque/defensa quedará como provisional.'}
async function load(){if(!matchId){$('status').textContent='Falta el identificador del partido.';return}const[{data:mp,error},{data:p},{data:m},{data:gp,error:gpe}]=await Promise.all([sb.from('match_players').select('player_id,team').eq('match_id',matchId),sb.from('players').select('id,nickname,age'),sb.from('matches').select('id,competition,match_date').eq('id',matchId).maybeSingle(),sb.from('gps_pitches').select('id,name,mode,corners,center_lat,center_lon,match_radius_m,is_active').eq('is_active',true)]);if(error){$('status').textContent='No se pudo cargar la alineación.';return}match=m;players=Object.fromEntries((p||[]).map(x=>[String(x.id),x]));pitches=gpe?[]:(gp||[]);$('player').innerHTML=(mp||[]).map(x=>`<option value="${x.player_id}">${players[String(x.player_id)]?.nickname||x.player_id} · ${x.team==='red'?'Rojo':'Negro'}</option>`).join('');renderPitches()}
$('analyze').onclick=async()=>{const f=$('fit').files[0];if(!f)return $('status').textContent='Selecciona un .fit';const p=players[$('player').value]||{},pitchChoice=$('pitch').value,selected=pitchChoice==='auto'?null:pitches.find(x=>String(x.id)===pitchChoice)||null,fields=pitchChoice==='auto'?pitches:[];$('status').textContent='Analizando…';try{latest=await analyzeFit(await f.arrayBuffer(),{age:p.age||null,field:selected,fields});$('result').hidden=false;mountPlayerGpsPanel($('result'),latest,{playerName:p.nickname||'Jugador',showSave:false});$('save').disabled=false;const pos=latest.analysisDetail?.positional||{},pitchName=pos.pitchName;$('status').innerHTML=pitchName?`Análisis listo · campo detectado: <b>${pitchName}</b>${pos.orientationReliable?' · orientación completa':' · falta definir periodos/dirección para etiquetar ataque y defensa'}.`:'Análisis listo · no se ha reconocido un campo calibrado; se usa orientación provisional.'}catch(e){console.error(e);$('status').textContent=e?.message||'No se pudo analizar el FIT'}};
$('save').onclick=async()=>{if(!latest)return;const{error}=await sb.from('match_player_gps').upsert(toSupabaseRow(Number(matchId),Number($('player').value),latest),{onConflict:'match_id,player_id'});if(error){$('status').textContent='No se pudo guardar: '+error.message;return}$('status').textContent='Datos GPS guardados.';setTimeout(()=>history.length>1?history.back():location.assign('./index.html'),650)};$('back').onclick=()=>history.length>1?history.back():location.assign('./index.html');load();
</script></body></html>
