<!doctype html>
<html lang="es">
<head>

<title>Álbum de cartas · Patxanguilles Antifeixistes</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#111;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
button{font:inherit}
.reader{
  position:fixed;inset:0;
  display:grid;
  grid-template-rows:58px minmax(0,1fr) 68px;
  background:#141516;
}
.toolbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:0 18px;
  background:#202124;
  border-bottom:1px solid rgba(255,255,255,.12);
  box-shadow:0 2px 12px rgba(0,0,0,.35);
  z-index:5;
}
.title{min-width:0}
.title strong{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title small{display:block;color:#adb3bb;font-size:11px;margin-top:2px}
.back{
  flex:none;border:1px solid rgba(255,255,255,.18);background:#2d3035;color:#fff;
  border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:800
}
.stage{
  min-height:0;
  display:block;
  overflow-y:auto;
  overflow-x:hidden;
  padding:0;
  background:#121315;
}
.page{
  position:relative;
  width:100vw;
  height:auto;
  aspect-ratio:1529/2048;
  margin:0;
  background:url('album-cartas.jpg') center top/100% auto no-repeat;
  box-shadow:none;
}
.slot{
  position:absolute;
  appearance:none;border:0;background:transparent;padding:0;cursor:pointer;
  transition:transform .16s ease,filter .16s ease;
}
.slot:hover{transform:scale(1.018);filter:brightness(1.04);z-index:3}
.slot img{width:100%;height:100%;display:block;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(0,0,0,.28))}
.slot-1{left:16.048%;top:21.55%;width:25.75%;height:20.25%}
.slot-2{left:37.12%;top:21.55%;width:25.75%;height:20.25%}
.slot-3{left:58.202%;top:21.55%;width:25.75%;height:20.25%}
.slot-4{left:16.048%;top:43.28%;width:25.75%;height:20.25%}
.slot-5{left:37.12%;top:43.28%;width:25.75%;height:20.25%}
.slot-6{left:58.202%;top:43.28%;width:25.75%;height:20.25%}
.slot-7{left:16.048%;top:65.72%;width:25.75%;height:20.25%}
.slot-8{left:37.12%;top:65.72%;width:25.75%;height:20.25%}
.slot-9{left:58.202%;top:65.72%;width:25.75%;height:20.25%}
.controls{
  display:flex;align-items:center;justify-content:center;gap:12px;
  padding:8px 14px;background:#202124;border-top:1px solid rgba(255,255,255,.12);z-index:5
}
.controls button{
  min-width:112px;border:1px solid rgba(255,255,255,.18);background:#2d3035;color:#fff;
  border-radius:8px;padding:10px 13px;cursor:pointer;font-weight:800
}
.controls button:disabled{opacity:.35;cursor:default}
.pageinfo{min-width:120px;text-align:center;font-weight:800;font-size:13px}
.loading{font-size:14px;color:#b8bec6}
.card-modal{
  position:fixed;inset:0;z-index:20;
  display:none;align-items:center;justify-content:center;padding:24px;
  overflow:hidden;
  background:rgba(0,0,0,.42);
}
.card-modal::before{
  content:"";
  position:absolute;
  inset:-35px;
  background-image:var(--card-modal-bg,url('album-cartas.jpg'));
  background-position:center;
  background-size:cover;
  background-repeat:no-repeat;
  filter:blur(9px) brightness(.42);
  transform:scale(1.08);
  z-index:-2;
}
.card-modal::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.28);
  z-index:-1;
}
.card-modal.open{display:flex}
body.card-open .zoom-controls{display:none!important}
.card-modal img{
  position:relative;
  z-index:1;
  max-width:min(92vw,640px);
  max-height:92vh;
  object-fit:contain;
  filter:drop-shadow(0 18px 30px rgba(0,0,0,.72));
}
.card-modal button{
  position:absolute;top:16px;right:16px;border:1px solid rgba(255,255,255,.2);
  background:#292c30;color:#fff;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer
}
@media(max-width:700px){
  .reader{grid-template-rows:52px minmax(0,1fr) 60px}
  .toolbar{padding:0 10px}
  .title small{display:none}
  .stage{padding:0}
  .page{
    width:100vw;
    height:auto;
    max-height:none;
  }
  .controls{gap:7px;padding:6px 7px}
  .controls button{min-width:84px;padding:9px 8px}
  .pageinfo{min-width:94px;font-size:12px}
}
}

.toolbar-actions{
  display:flex;
  align-items:center;
  gap:9px;
  flex:none;
}
.toolbtn,.zoom-btn{
  border:1px solid rgba(255,255,255,.18);
  background:#2d3035;
  color:#fff;
  border-radius:8px;
  cursor:pointer;
  font-weight:800;
}
.toolbtn{padding:9px 12px}
.zoom-controls{
  display:flex;
  align-items:center;
  gap:5px;
  padding:3px 5px;
  border:1px solid rgba(255,255,255,.12);
  background:#181a1d;
  border-radius:9px;
}
.zoom-btn{
  width:32px;
  height:32px;
  padding:0;
  font-size:22px;
  line-height:30px;
}
.zoom-icon{font-size:15px;opacity:.82}

.stage{
  touch-action:none;
  overscroll-behavior:contain;
  cursor:grab;
  user-select:none;
  -webkit-user-select:none;
}
.stage.is-dragging{cursor:grabbing}
.stage button,.stage a,.slot{cursor:pointer}
.stage img{-webkit-user-drag:none;user-drag:none}
.page-viewport{
  position:relative;
  width:100%;
  transform-origin:top center;
  will-change:transform;
}
.page{
  transform-origin:top center;
}

/* Modo ancho: llena horizontalmente y permite scroll vertical */
body.fit-width .stage{
  overflow-y:auto;
  overflow-x:auto;
}
body.fit-width .page-viewport{
  width:100vw;
}
body.fit-width .page{
  width:100vw;
  height:auto;
  max-width:none;
  max-height:none;
  aspect-ratio:1529/2048;
}

/* Modo alto: página completa visible en vertical, centrada */
body.fit-height .stage{
  display:flex;
  align-items:flex-start;
  justify-content:center;
  overflow:auto;
  padding:8px;
}
body.fit-height .page-viewport{
  width:auto;
  height:calc(100dvh - 126px);
  aspect-ratio:1529/2048;
}
body.fit-height .page{
  width:auto;
  height:100%;
  aspect-ratio:1529/2048;
  max-width:none;
  max-height:none;
}

@media(max-width:700px){
  .toolbar{
    overflow-x:auto;
  }
  .toolbar-actions{
    gap:5px;
  }
  .toolbtn{
    padding:8px 9px;
    font-size:12px;
    white-space:nowrap;
  }
  .zoom-controls{gap:2px}
  .zoom-btn{
    width:30px;height:30px;font-size:20px;
  }
  .back{
    white-space:nowrap;
    padding:8px 9px;
    font-size:12px;
  }
  body.fit-height .page-viewport{
    height:calc(100dvh - 112px);
  }
}


/* v4 · controles reposicionados */
.toolbar{
  position:relative;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  align-items:center;
}
.toolbar .title{
  justify-self:start;
}
.fit-toggle{
  justify-self:center;
  white-space:nowrap;
}
.toolbar .back{
  justify-self:end;
}

.zoom-floating{
  position:fixed;
  right:18px;
  bottom:82px;
  z-index:30;
  box-shadow:0 6px 18px rgba(0,0,0,.42);
}

@media(max-width:700px){
  .toolbar{
    grid-template-columns:minmax(0,1fr) auto auto;
    gap:6px;
    overflow:visible;
  }
  .toolbar .title strong{
    max-width:32vw;
  }
  .fit-toggle{
    font-size:11px;
    padding:7px 8px;
  }
  .toolbar .back{
    font-size:11px;
    padding:7px 8px;
  }
  .zoom-floating{
    right:10px;
    bottom:70px;
  }
}

/* v19 · presentación especial de cartas */
.card-modal{isolation:isolate;background:radial-gradient(circle at 50% 48%,rgba(122,89,15,.20),rgba(0,0,0,.72) 58%,rgba(0,0,0,.88))}
.card-fx{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.card-media{
  position:relative;z-index:2;
  display:flex;align-items:center;justify-content:center;
  max-width:min(92vw,640px);max-height:92vh;
  cursor:pointer;overflow:hidden;
  filter:drop-shadow(0 20px 34px rgba(0,0,0,.78));
}
.card-media img,.card-media video{
  display:block;max-width:100%;max-height:92vh;width:auto;height:auto;object-fit:contain;
}
.card-modal .card-media img{filter:none}
.card-media video{display:none}
.card-media.video-active img{display:none}
.card-media.video-active video{display:block}
.card-shine{
  position:absolute;inset:-20%;
  pointer-events:none;
  background:linear-gradient(112deg,transparent 35%,rgba(255,255,255,.04) 43%,rgba(255,242,178,.50) 49%,rgba(255,255,255,.10) 54%,transparent 62%);
  transform:translateX(-115%) skewX(-10deg);
  mix-blend-mode:screen;
  animation:cardShine 3.8s ease-in-out infinite;
}
.card-media.video-active .card-shine{opacity:.25}
@keyframes cardShine{
  0%,24%{transform:translateX(-120%) skewX(-10deg);opacity:0}
  30%{opacity:.85}
  55%{transform:translateX(120%) skewX(-10deg);opacity:.85}
  61%,100%{transform:translateX(120%) skewX(-10deg);opacity:0}
}
.fx-particle{
  position:absolute;left:var(--x);top:-8vh;width:var(--s);height:calc(var(--s)*1.9);
  border-radius:2px;background:hsl(var(--h) 92% 62%);
  box-shadow:0 0 8px hsla(var(--h),95%,65%,.75);
  opacity:0;transform:rotate(var(--r));
  animation:confettiFall var(--d) linear var(--delay) infinite;
}
@keyframes confettiFall{
  0%{transform:translate3d(0,-8vh,0) rotate(var(--r));opacity:0}
  8%{opacity:.95}
  100%{transform:translate3d(var(--drift),112vh,0) rotate(calc(var(--r) + 560deg));opacity:0}
}
.fx-burst{
  position:absolute;width:5px;height:5px;border-radius:50%;
  background:#ffe37a;box-shadow:
  0 -65px 2px #ffd65a,45px -46px 2px #fff0a3,65px 0 2px #ffbd3b,
  45px 46px 2px #ffe37a,0 65px 2px #fff0a3,-45px 46px 2px #ffbd3b,
  -65px 0 2px #ffe37a,-45px -46px 2px #fff0a3;
  opacity:0;animation:fxBurst 3.4s ease-out infinite;
}
.fx-burst-a{left:18%;top:28%;animation-delay:.25s}
.fx-burst-b{right:17%;top:37%;animation-delay:1.7s;transform:scale(.72)}
@keyframes fxBurst{
  0%,12%{opacity:0;transform:scale(.18)}
  18%{opacity:.95}
  42%{opacity:.22;transform:scale(1.8)}
  52%,100%{opacity:0;transform:scale(2.1)}
}
.card-modal.open .card-media{animation:cardReveal .52s cubic-bezier(.2,.85,.25,1)}
@keyframes cardReveal{from{opacity:0;transform:scale(.88) translateY(18px)}to{opacity:1;transform:scale(1) translateY(0)}}

@media(max-width:700px){
  .reader{grid-template-rows:minmax(0,1fr) 60px}
  .toolbar{display:none!important}
  .zoom-floating,.zoom-controls{display:none!important}
}
@media(prefers-reduced-motion:reduce){
  .card-shine,.fx-particle,.fx-burst,.card-modal.open .card-media{animation:none!important}
}

</style>

<body class="fit-height">
<div class="reader">
  <header class="toolbar">
    <div class="title">
      <strong>Álbum de cartas · Patxanguilles Antifeixistes</strong>
      <small id="subtitle">Temporada 26/27</small>
    </div>

    <button id="fitToggle" class="toolbtn fit-toggle" onclick="toggleFitMode()" title="Cambiar entre ajustar al ancho o al alto">Ajustar vista · Alto</button>

    <button class="back" onclick="closeAlbumWindow()">✕ Cerrar álbum</button>
  </header>

  <main id="stage" class="stage">
    <div id="pageViewport" class="page-viewport">
      <div id="page" class="page"><div class="loading" id="loading">Cargando cartas…</div></div>
    </div>
  </main>

  <footer class="controls">
    <button id="prev" onclick="changePage(-1)">← Anterior</button>
    <div id="pageInfo" class="pageinfo">Página 1 de 1</div>
    <button id="next" onclick="changePage(1)">Siguiente →</button>
  </footer>
</div>

<div class="zoom-controls zoom-floating" aria-label="Controles de zoom">
  <button class="zoom-btn" onclick="zoomBy(-0.1)" title="Alejar">−</button>
  <span class="zoom-icon" aria-hidden="true">🔍</span>
  <button class="zoom-btn" onclick="zoomBy(0.1)" title="Acercar">+</button>
</div>

<div id="cardModal" class="card-modal" onclick="modalBackdrop(event)">
  <div class="card-fx" aria-hidden="true">
    <div class="fx-burst fx-burst-a"></div>
    <div class="fx-burst fx-burst-b"></div>
    <div class="fx-particles" id="fxParticles"></div>
  </div>
  <button class="card-close" onclick="closeCard()">Cerrar ✕</button>
  <div id="cardMedia" class="card-media" onclick="toggleCardMedia(event)" title="Pulsa para alternar carta y vídeo">
    <img id="cardModalImg" alt="Carta de jugador">
    <video id="cardModalVideo" playsinline preload="metadata"></video>
    <span class="card-shine" aria-hidden="true"></span>
  </div>
</div>

<script>
const SUPABASE_URL='https://cnnhstlguewrxjihhlqc.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_uWEwYEMkAe3YkeAzX7ACAg_0aEYHmM6';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{
  auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}
});

let cards=[],pageIndex=0;
let activeCardName='';
const CARD_VIDEOS={
  'rafeta':'RAFETA_1.mp4'
};
const PER_PAGE=9;
const ALBUM_BACKGROUNDS=[
  'album-cartas.jpg',
  'pagina album 2.jpg',
  'pagina album 4.jpg',
  'album 5.jpg'
];

function escapeHtml(v){
  return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function closeAlbumWindow(){
  try{
    if(window.opener&&!window.opener.closed)window.opener.focus();
  }catch(e){}
  window.close();
  setTimeout(()=>{
    if(!window.closed)window.location.href='index.html';
  },150);
}
async function loadCards(){
  const {data,error}=await sb.from('players').select('nickname,card_url,football7').eq('football7',true).not('card_url','is',null).order('nickname');
  const loading=document.getElementById('loading');
  if(error){
    console.error(error);
    loading.textContent='No se pudieron cargar las cartas.';
    return;
  }
  const uniqueCards=new Map();
  (data||[]).filter(x=>x.card_url).forEach(x=>{
    const key=String(x.nickname||'').trim().toLocaleLowerCase('es');
    if(key&&!uniqueCards.has(key))uniqueCards.set(key,x);
  });
  cards=[...uniqueCards.values()];
  document.getElementById('subtitle').textContent=`Temporada 26/27 · ${cards.length} carta${cards.length===1?'':'s'}`;
  render();
}
function render(){
  const page=document.getElementById('page');
  const totalPages=Math.max(ALBUM_BACKGROUNDS.length,Math.ceil(cards.length/PER_PAGE),1);
  pageIndex=Math.max(0,Math.min(pageIndex,totalPages-1));
  const items=cards.slice(pageIndex*PER_PAGE,pageIndex*PER_PAGE+PER_PAGE);
  const background=ALBUM_BACKGROUNDS[pageIndex]||ALBUM_BACKGROUNDS[ALBUM_BACKGROUNDS.length-1];
  page.style.backgroundImage=`url("${background}")`;
  page.className=`page album-page-${pageIndex+1}`;

  page.innerHTML='';
  items.forEach((item,i)=>{
    const b=document.createElement('button');
    b.className=`slot slot-${i+1}`;
    b.title=`Ver carta de ${item.nickname}`;
    b.innerHTML=`<img src="${escapeHtml(item.card_url)}" alt="Carta de ${escapeHtml(item.nickname)}">`;
    b.onclick=()=>openCard(item.card_url,item.nickname);
    page.appendChild(b);
  });

  document.getElementById('pageInfo').textContent=`Página ${pageIndex+1} de ${totalPages}`;
  document.getElementById('prev').disabled=pageIndex===0;
  document.getElementById('next').disabled=pageIndex>=totalPages-1;
}
function changePage(delta){
  pageIndex+=delta;
  render();
}
function cardVideoFor(name){
  return CARD_VIDEOS[String(name||'').trim().toLocaleLowerCase('es')]||'';
}
function buildCardParticles(){
  const box=document.getElementById('fxParticles');
  if(!box)return;
  box.innerHTML='';
  for(let i=0;i<34;i++){
    const p=document.createElement('i');
    p.className='fx-particle';
    p.style.setProperty('--x',`${Math.random()*100}%`);
    p.style.setProperty('--s',`${3+Math.random()*5}px`);
    p.style.setProperty('--h',`${38+Math.random()*18}`);
    p.style.setProperty('--r',`${Math.random()*180}deg`);
    p.style.setProperty('--d',`${4.8+Math.random()*4.2}s`);
    p.style.setProperty('--delay',`${-Math.random()*7}s`);
    p.style.setProperty('--drift',`${-55+Math.random()*110}px`);
    box.appendChild(p);
  }
}
function openCard(url,name){
  const modal=document.getElementById('cardModal');
  const img=document.getElementById('cardModalImg');
  const video=document.getElementById('cardModalVideo');
  const media=document.getElementById('cardMedia');
  const background=ALBUM_BACKGROUNDS[pageIndex]||ALBUM_BACKGROUNDS[0];
  activeCardName=name||'';
  modal.style.setProperty('--card-modal-bg',`url("${background}")`);
  img.src=url;img.alt=`Carta de ${name}`;
  media.classList.remove('video-active');
  video.pause();video.removeAttribute('src');video.load();
  const videoUrl=cardVideoFor(name);
  if(videoUrl)video.src=videoUrl;
  buildCardParticles();
  modal.classList.add('open');
  document.body.classList.add('card-open');
}
function toggleCardMedia(e){
  e.stopPropagation();
  const media=document.getElementById('cardMedia');
  const video=document.getElementById('cardModalVideo');
  const videoUrl=cardVideoFor(activeCardName);
  if(!videoUrl)return;
  if(media.classList.contains('video-active')){
    video.pause();
    media.classList.remove('video-active');
  }else{
    if(!video.src)video.src=videoUrl;
    media.classList.add('video-active');
    video.currentTime=0;
    video.play().catch(()=>{});
  }
}
function closeCard(){
  const modal=document.getElementById('cardModal');
  const video=document.getElementById('cardModalVideo');
  const media=document.getElementById('cardMedia');
  video.pause();
  media.classList.remove('video-active');
  modal.classList.remove('open');
  document.body.classList.remove('card-open');
}
function modalBackdrop(e){if(e.target.id==='cardModal')closeCard()}
document.addEventListener('keydown',e=>{
  if(document.getElementById('cardModal').classList.contains('open')){
    if(e.key==='Escape')closeCard();
    return;
  }
  if(e.key==='ArrowLeft')changePage(-1);
  if(e.key==='ArrowRight')changePage(1);
  if(e.key==='Escape')closeAlbumWindow();
});

let fitMode='height';
let zoomLevel=1;
let pinchStartDistance=0;
let pinchStartZoom=1;
let pinchLastMid=null;

function applyViewerState(){
  document.body.classList.toggle('fit-width',fitMode==='width');
  document.body.classList.toggle('fit-height',fitMode==='height');
  const viewport=document.getElementById('pageViewport');
  if(viewport)viewport.style.transform=`scale(${zoomLevel})`;
  const btn=document.getElementById('fitToggle');
  if(btn)btn.textContent=`Ajustar vista · ${fitMode==='width'?'Ancho':'Alto'}`;
}

function toggleFitMode(){
  fitMode=fitMode==='width'?'height':'width';
  zoomLevel=1;
  applyViewerState();
  const stage=document.getElementById('stage');
  if(stage){stage.scrollTop=0;stage.scrollLeft=0}
}

function zoomBy(delta){
  setZoom(zoomLevel+delta);
}

function setZoom(value){
  zoomLevel=Math.min(3,Math.max(0.45,Math.round(value*100)/100));
  applyViewerState();
}

function touchDistance(touches){
  const a=touches[0],b=touches[1];
  return Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);
}
function touchMidpoint(touches){
  const a=touches[0],b=touches[1];
  return {x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2};
}

const viewerStage=document.getElementById('stage');

// MÓVIL: gesto natural de dos dedos = pellizcar para zoom + desplazar para mover la página.
viewerStage.addEventListener('touchstart',e=>{
  if(e.touches.length===2){
    pinchStartDistance=touchDistance(e.touches);
    pinchStartZoom=zoomLevel;
    pinchLastMid=touchMidpoint(e.touches);
    e.preventDefault();
  }
},{passive:false});

viewerStage.addEventListener('touchmove',e=>{
  if(e.touches.length===2&&pinchStartDistance>0){
    const currentDistance=touchDistance(e.touches);
    const currentMid=touchMidpoint(e.touches);
    setZoom(pinchStartZoom*(currentDistance/pinchStartDistance));
    if(pinchLastMid){
      viewerStage.scrollLeft-=currentMid.x-pinchLastMid.x;
      viewerStage.scrollTop-=currentMid.y-pinchLastMid.y;
    }
    pinchLastMid=currentMid;
    e.preventDefault();
  }
},{passive:false});

viewerStage.addEventListener('touchend',e=>{
  if(e.touches.length<2){
    pinchStartDistance=0;
    pinchLastMid=null;
  }
},{passive:true});

// ESCRITORIO: mano para agarrar y arrastrar la página, como un visor de imagen/mapa.
let dragging=false;
let dragStartX=0,dragStartY=0,dragStartLeft=0,dragStartTop=0;

viewerStage.addEventListener('mousedown',e=>{
  if(e.button!==0) return;
  if(e.target.closest('button,a,.slot')) return;
  dragging=true;
  dragStartX=e.clientX;
  dragStartY=e.clientY;
  dragStartLeft=viewerStage.scrollLeft;
  dragStartTop=viewerStage.scrollTop;
  viewerStage.classList.add('is-dragging');
  e.preventDefault();
});

document.addEventListener('mousemove',e=>{
  if(!dragging) return;
  viewerStage.scrollLeft=dragStartLeft-(e.clientX-dragStartX);
  viewerStage.scrollTop=dragStartTop-(e.clientY-dragStartY);
});

document.addEventListener('mouseup',()=>{
  if(!dragging) return;
  dragging=false;
  viewerStage.classList.remove('is-dragging');
});

applyViewerState();

loadCards();
</script>
